version: '3.8'

services:
  # PostgreSQL with pgvector extension
  postgres:
    image: ankane/pgvector:latest
    container_name: evoforge-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-evoforge}
      POSTGRES_USER: ${POSTGRES_USER:-evoforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evoforge}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-evoforge}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: evoforge-backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-evoforge}:${POSTGRES_PASSWORD:-evoforge}@postgres:5432/${POSTGRES_DB:-evoforge}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      RAY_ADDRESS: ray-head:6379
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /var/run/docker.sock:/var/run/docker.sock  # For Docker sandbox
    depends_on:
      postgres:
        condition: service_healthy
      ray-head:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Ray Head Node
  ray-head:
    image: rayproject/ray:2.9.1-py311
    container_name: evoforge-ray-head
    ports:
      - "6379:6379"  # Redis port
      - "8265:8265"  # Ray dashboard
    command: ray start --head --dashboard-host=0.0.0.0 --block
    volumes:
      - ./evolution-engine:/workspace
    environment:
      RAY_REDIS_ADDRESS: ray-head:6379

  # Ray Worker Nodes (optional, for scaling)
  # ray-worker:
  #   image: rayproject/ray:2.9.1-py311
  #   container_name: evoforge-ray-worker
  #   depends_on:
  #     - ray-head
  #   command: ray start --address=ray-head:6379 --block
  #   volumes:
  #     - ./evolution-engine:/workspace

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: evoforge-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    command: npm run dev

volumes:
  postgres_data:
    driver: local

networks:
  default:
    name: evoforge-network
